  - 批量或流式运行仿真函数
  - 累积目标统计量
  - 计算标准误、分位数或置信区间
  - 增加样本量并检查收敛
parameters:
  - {name: sample_size, value: null, description: 模拟次数, range: "accuracy-dependent", evidence_ids: [], provenance: AI_INFERRED}
