aliases: [蒙特卡洛采样, 随机采样算法]
category: simulation
purpose: 从指定分布重复采样并估计统计量
inputs: [random distributions, sample size, simulation function, seed]
outputs: [samples, estimates, uncertainty intervals]
pseudocode:
  - 初始化可复现随机数生成器
