stopping_criteria: [达到样本量, 估计标准误低于阈值]
complexity: {time: "O(N·C_f)", space: "O(N) or O(1) streaming", notes: ""}
randomness: {uses_randomness: true, seed_required: true, notes: 报告随机数生成器和 seed}
