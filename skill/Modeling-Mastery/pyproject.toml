[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modeling-mastery"
version = "0.2.0"
description = "Mathematical modeling paper-to-knowledge pipeline for evidence-grounded model, algorithm, code, and Obsidian notes."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Azen / Modeling-Mastery contributors"}]
keywords = ["mathematical-modeling", "paper-analysis", "obsidian", "agent-skill", "mineru", "docling"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "jinja2>=3.1",
  "jsonschema>=4.22",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]
docling = ["docling>=2.70"]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]
all = ["pymupdf>=1.24", "docling>=2.70", "anthropic>=0.40", "pytest>=8.2"]

[project.scripts]
modeling-mastery = "modeling_mastery.cli:app"
mmastery = "modeling_mastery.cli:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["modeling_mastery*"]

[tool.setuptools.package-data]
modeling_mastery = [
  "assets/schemas/*.json",
  "assets/templates/*.md",
  "assets/references/**/*.yaml",
  "assets/references/**/*.md",
  "assets/skills/*/*.md",
  "assets/skills/*/references/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
